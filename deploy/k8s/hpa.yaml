# The backend HPA was removed deliberately (single-replica decision): the
# backend keeps auth/session/alert state on its own /data volume (SQLite
# auth DB + file sessions), so replicas 2-10 diverge — split-brain logins
# and writes that vanish on the next request routed elsewhere. Re-adding it
# requires a shared store first (Postgres-backed auth is not functional yet,
# see backend_api/app/core/db_backend.py) plus shared session storage; until
# then, pin backend replicas: 1 in backend-deployment.yaml instead.
# Frontend stays autoscaled — stateless nginx, nothing to diverge.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ergovigilance-frontend-hpa
  namespace: ergovigilance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ergovigilance-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
