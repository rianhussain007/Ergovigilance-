apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ergovigilance-postgres
  namespace: ergovigilance
  labels:
    app: ergovigilance-postgres
    tier: database
spec:
  serviceName: ergovigilance-postgres
  replicas: 1
  selector:
    matchLabels:
      app: ergovigilance-postgres
  template:
    metadata:
      labels:
        app: ergovigilance-postgres
        tier: database
    spec:
      securityContext:
        runAsNonRoot: true
        # postgres:16-alpine runs as uid=gid 70 (verified: docker run --user
        # 70:70); 999 is the debian image's uid and made fsGroup wrong here.
        runAsUser: 70  # postgres user (alpine)
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ergovigilance-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ergovigilance-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: ergovigilance
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - ergovigilance
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - ergovigilance
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            # readOnlyRootFilesystem: postgres needs /run (unix socket + perms
            # for the pg listener) and /tmp; both verified writable as tmpfs
            # with gid 70 / mode 1777 against this exact image.
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: postgres-data
          emptyDir: {}
        - name: run
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
