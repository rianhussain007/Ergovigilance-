apiVersion: apps/v1
kind: Deployment
metadata:
  name: ergovigilance-backend
  namespace: ergovigilance
  labels:
    app: ergovigilance-backend
    tier: backend
spec:
  # Single replica by decision: auth/session/alert state lives on this pod's
  # /data volume (SQLite auth DB + file sessions), so a second replica
  # diverges — split-brain logins, writes that vanish on the next request.
  # The backend HPA was removed for the same reason (see hpa.yaml).
  replicas: 1
  selector:
    matchLabels:
      app: ergovigilance-backend
  # Recreate: one replica with a ReadWriteOnce PVC cannot surge — a second
  # pod on another node would wait forever for the volume while
  # maxUnavailable: 0 blocked the rollout. Brief restart downtime is the
  # accepted trade; the data now survives it (PVC-backed /data).
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ergovigilance-backend
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: ergovigilance-backend:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DEBUG
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ergovigilance-secrets
                  key: database-url
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ergovigilance-secrets
                  key: jwt-secret
            - name: AUDIT_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: ergovigilance-secrets
                  key: audit-hmac-key
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ergovigilance-secrets
                  key: metrics-token
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: ergovigilance-secrets
                  key: smtp-host
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: ergovigilance-secrets
                  key: smtp-user
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: ergovigilance-secrets
                  key: smtp-pass
                  optional: true
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: ergovigilance-secrets
                  key: slack-webhook
                  optional: true
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ergovigilance-secrets
                  key: stripe-secret
                  optional: true
            # Write-path analysis (P1 readOnlyRootFilesystem): every directory
            # the app creates files in lives on the /data volume below (PVC —
            # emptyDir would lose the SQLite auth DB on every rollout).
            # WEB_CONCURRENCY=1 is defense-in-depth, not the only guard:
            # multiple uvicorn workers used to race run_migrations() on a fresh
            # DB (duplicate column / no such table) and crash-loop the pod.
            # Migrations now serialize first-boots with BEGIN IMMEDIATE plus an
            # in-transaction version re-check (a79fbb9), so a second worker no
            # longer reproduces that crash; 1 remains the deliberate setting.
            - name: WEB_CONCURRENCY
              value: "1"
            - name: HOME
              value: /tmp
            - name: AUTH_DB_PATH
              value: /data/local_auth.db
            - name: AUDIT_LOG_DIR
              value: /data/audit_logs
            - name: SESSIONS_DIR
              value: /data/sessions
            - name: REPORTS_DIR
              value: /data/reports
            - name: STORAGE_REPORTS_DIR
              value: /data/reports
            - name: STORAGE_RECORDINGS_DIR
              value: /data/recordings
            - name: STORAGE_ALERTS_DIR
              value: /data/alerts
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ergovigilance-backend-data
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
