# ErgoVigilance Secrets Template
# 
# BEFORE DEPLOYING:
# 1. Fill in all values below
# 2. Apply: kubectl apply -f secrets-template.yaml
# 3. NEVER commit the filled version to git
#
# Generate strong secrets with:
#   python -c "import secrets; print(secrets.token_urlsafe(64))"
#   openssl rand -base64 32

apiVersion: v1
kind: Secret
metadata:
  name: ergovigilance-secrets
  namespace: ergovigilance
type: Opaque
stringData:
  # Database
  database-url: "postgresql://ergovigilance:CHANGE_ME@ergovigilance-postgres:5432/ergovigilance"
  postgres-user: "ergovigilance"
  postgres-password: "CHANGE_ME"
  
  # JWT Authentication
  jwt-secret: "CHANGE_ME_GENERATE_WITH_PYTHON"
  
  # SMTP (for email alerts)
  smtp-host: ""
  smtp-user: ""
  smtp-pass: ""
  
  # Slack (for Slack alerts)
  slack-webhook: ""
  
  # Stripe (for billing)
  stripe-secret: ""
  stripe-webhook: ""
  stripe-price-id: ""
