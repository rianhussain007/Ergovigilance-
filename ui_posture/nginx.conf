# ErgoVigilance frontend — base nginx config (HTTP).
# For TLS see nginx.tls.conf.example — mount it over this file with certs.

server_tokens off;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Video analysis allows uploads up to 200 MB — nginx's 1 MB default
    # would reject them with 413. Keep in sync with the API limit.
    client_max_body_size 200m;

    # Longer timeouts for large uploads and slow camera networks.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    # Security headers (HSTS only makes sense over TLS — see TLS example).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # camera=self keeps live monitoring working on the same origin.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to backend API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
