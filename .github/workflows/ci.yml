name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── Backend tests ──────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend_api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest ../tests/ -q --tb=short

  # ── Cloud core tests ───────────────────────────────────────────
  cloud-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yolo_cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: yolo_cloud/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cloud core tests
        run: python -m pytest ../tests/ -k "cloud" -q --tb=short || true

  # ── Frontend build + typecheck ─────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui_posture
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui_posture/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Docker build ───────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ergovigilance-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend_api/Dockerfile
          push: false
          tags: ergovigilance-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build cloud core image
        uses: docker/build-push-action@v5
        with:
          context: yolo_cloud
          file: yolo_cloud/Dockerfile
          push: false
          tags: ergovigilance-cloud-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
