name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint + build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui_posture
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui_posture/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (npm run lint)
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Dependency audit (fail on known vulnerabilities)
        run: npm audit --omit=dev

  backend:
    name: Backend (tests + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend_api/requirements-dev.txt

      - name: Verify model artifacts (MANIFEST checksums)
        run: python scripts/verify_models.py

      - name: Run backend test suite
        run: pytest backend_api/tests -q

      - name: Legacy unit scripts (self-contained)
        run: |
          set -e
          for f in \
            scripts/test_event_bus.py \
            scripts/test_context_engine.py \
            scripts/test_alert_engine.py \
            scripts/test_issue_detection.py \
            scripts/test_history_engine.py \
            scripts/test_context_snapshot.py \
            scripts/test_recommendation_engine.py \
            scripts/test_recommendation_engine_v2.py \
            scripts/test_alert_persistence.py \
            scripts/test_session_analytics.py; do
            echo "== $f =="
            timeout 120 python "$f"
          done

      - name: Python dependency audit (fail on known vulnerabilities)
        run: pip-audit -r backend_api/requirements.txt --progress-spinner off
