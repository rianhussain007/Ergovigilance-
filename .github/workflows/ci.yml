name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# NOTE ON PATHS: the `file:` input of docker/build-push-action resolves against
# the WORKSPACE (the checkout root), not against `context:`. Every `file:` below
# is therefore written workspace-relative, which is the one canonical form —
# mixing a context-relative `file:` silently builds the wrong image or fails.

jobs:
  # ── Backend tests ──────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend_api/requirements.txt
            backend_api/requirements-dev.txt

      # requirements-dev.txt starts with `-r requirements.txt`, so this installs
      # the runtime deps AND the CI tooling (pytest, httpx2, pip-audit). The old
      # `pip install -r requirements.txt` left no pytest, so the job could not
      # actually run the suite.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Advisory for now: surface advisories without failing the gate while a
      # baseline is being established. Remove `continue-on-error` to enforce.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: pip-audit

      # `tests` is relative to working-directory (backend_api/tests). The old
      # `../tests/` pointed at the repo-root legacy folder (3 files) and, being
      # outside backend_api/tests/, never loaded its conftest — so DEBUG stayed
      # false and collection died on AUTH_JWT_SECRET.
      # No explicit `-q` here: pytest.ini addopts already supplies it, and a
      # second one becomes `-qq`, which suppresses the final count line — the
      # one line that makes the gate readable in the CI log.
      - name: Run backend tests
        run: python -m pytest tests --tb=short

  # ── Cloud core tests ───────────────────────────────────────────
  cloud-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yolo_cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            yolo_cloud/requirements.txt
            yolo_cloud/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Runs ALL 96 cloud tests. The previous command was both wrong-target and
      # self-masking: `../tests/ -k "cloud"` collected the repo-root legacy
      # folder and filtered it, and `|| true` meant a red suite still reported
      # green — that is how this job gated nothing.
      #
      # No test needs a GPU or the YOLO weights: model loading is lazy
      # (YOLOPoseEngine.initialize()) and the suite was verified green with
      # YOLO_MODEL pointed at a nonexistent file. Verified 96/96 locally, so
      # nothing is skipped here — any future GPU/weights-dependent test must be
      # skipped explicitly with `pytest.mark.skipif(reason=...)`, never masked.
      - name: Run cloud core tests
        run: python -m pytest tests -q --tb=short

  # ── Frontend build + typecheck ─────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui_posture
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui_posture/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Build
        run: npm run build

  # ── Docker build ───────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # There is no Dockerfile at the repo root — the frontend image is defined
      # by ui_posture/Dockerfile (the path docker-compose.yml builds with).
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ui_posture/Dockerfile
          push: false
          tags: ergovigilance-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend_api/Dockerfile
          push: false
          tags: ergovigilance-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build cloud core image
        uses: docker/build-push-action@v5
        with:
          context: yolo_cloud
          file: yolo_cloud/Dockerfile
          push: false
          tags: ergovigilance-cloud-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Supply chain: secret scan (DEEP_AUDIT §12 P1) ─────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret that was committed and later removed must
      # still be caught. Pinned scanner image + repo config so CI runs
      # exactly the command verified locally (295 commits clean, and a
      # planted random token still fails the gate).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (full history, allowlist in .gitleaks.toml)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner

  # ── Supply chain: Trivy + SBOM (DEEP_AUDIT §12 P1) ────────────
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hard gate: misconfigurations in the Dockerfiles / compose files /
      # k8s manifests (pinned FROM digests, non-root USER,
      # readOnlyRootFilesystem). A checkout contains only tracked files,
      # and --skip-dirs .git keeps the ~27 GB of untracked local data and
      # history blobs out of the walk on any self-hosted runner.
      - name: Trivy config (Dockerfile / compose / k8s)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/aquasecurity/trivy:0.58.1 config \
            --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .git --no-progress /repo

      # Hard gate: secrets in tracked files (complements gitleaks with a
      # second engine; pinned image = stable rules, no external drift).
      - name: Trivy secret scan (tracked files)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/aquasecurity/trivy:0.58.1 fs \
            --scanners secret --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs .git --no-progress /repo

      # Advisory for now, same posture as pip-audit above: CVE data drifts
      # daily, so a fresh advisory must not randomly redden unrelated PRs.
      # Remove `continue-on-error` to enforce once the baseline is owned.
      - name: Trivy vulnerability scan (advisory)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/aquasecurity/trivy:0.58.1 fs \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs .git --no-progress /repo

      # CycloneDX SBOM of the tracked dependency manifests, uploaded as a
      # build artifact for the TRL-8 evidence pack.
      - name: Generate SBOM (CycloneDX)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/aquasecurity/trivy:0.58.1 fs \
            --format cyclonedx --output /repo/sbom.cdx.json \
            --skip-dirs .git --no-progress /repo

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
