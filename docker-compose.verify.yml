# Standalone verification stack — same services/images as docker-compose.yml but
# mapped to free host ports so the container checks (login, PDF export,
# persistence) never touch the local Postgres on 5432 or the dev backend on
# 8000. Used only for the verification pass; not part of the normal deployment.
#
# NOTE: run with `docker compose -f docker-compose.verify.yml up -d` ONLY —
# do NOT merge with docker-compose.yml (`-f a -f b`). Compose appends `ports`
# lists on merge, so db would bind BOTH 5432 and 5433 (5432 collides with any
# local Postgres). This file is self-contained and defines all services.
services:
  db:
    image: postgres:16-alpine
    container_name: ergovigilance-db
    environment:
      - POSTGRES_USER=ergovigilance
      - POSTGRES_PASSWORD=ergovigilance
      - POSTGRES_DB=ergovigilance
    volumes:
      - ergovigilance-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ergovigilance -d ergovigilance"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend_api/Dockerfile
    container_name: ergovigilance-backend
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - DEBUG=true
      - USE_MOCK_REPOSITORY=true
      - AUTH_JWT_SECRET=dev-local-ergo-vigilance-secret-change-me
      - TRUST_PROXY_HEADERS=true
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8080
      - LOG_LEVEL=INFO
      - AUTH_DB_PATH=/data/local_auth.db
      - DATABASE_URL=postgresql://ergovigilance:ergovigilance@db:5432/ergovigilance
      - PG_TIMESCALEDB=false
      - SESSIONS_DIR=/data/sessions
    volumes:
      - ergovigilance-db:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: ui_posture/Dockerfile
    container_name: ergovigilance-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ergovigilance-db:
  ergovigilance-pg:
