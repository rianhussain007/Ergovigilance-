version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend_api/Dockerfile
    container_name: ergovigilance-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - USE_MOCK_REPOSITORY=true
      # Set a strong secret for production: DEBUG=false + missing/known secret = refused to start
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-dev-local-ergo-vigilance-secret-change-me}
      # True because the nginx frontend is the trusted proxy; do not expose :8000 publicly
      - TRUST_PROXY_HEADERS=true
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost
      - LOG_LEVEL=INFO
      - AUTH_DB_PATH=/data/local_auth.db
    volumes:
      - ergovigilance-db:/data
    restart: unless-stopped
    # Liveness probe for orchestrators / docker compose ps (python, not curl,
    # because the image is python:3.12-slim and ships no curl).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: ui_posture/Dockerfile
    container_name: ergovigilance-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ergovigilance-db:
