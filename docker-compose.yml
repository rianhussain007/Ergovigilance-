services:
  db:
    # Tier 1 telemetry store — session summaries + per-frame timeline rows.
    # Swap the image to timescale/timescaledb:latest-pg16 and set
    # PG_TIMESCALEDB=true on the backend for time-series hypertables.
    image: postgres:16-alpine
    container_name: ergovigilance-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ergovigilance}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ergovigilance}
      - POSTGRES_DB=${POSTGRES_DB:-ergovigilance}
    volumes:
      - ergovigilance-pg:/var/lib/postgresql/data
    # Loopback-only: never expose Postgres publicly.
    # Ports are .env-driven so one file deploys on any clean machine
    # (override with POSTGRES_PORT / BACKEND_PORT / FRONTEND_PORT).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ergovigilance} -d ${POSTGRES_DB:-ergovigilance}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend_api/Dockerfile
    container_name: ergovigilance-backend
    # Loopback-only: the API is reached through the nginx frontend (which talks
    # to it over the internal Docker network). Never publish :8000 publicly.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    environment:
      # Production posture by default; set DEBUG=true for local development.
      - DEBUG=${DEBUG:-false}
      # Required with DEBUG=false: the API refuses to start unless this is a
      # strong (>=32 char) non-default secret. Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required (>=32 chars) - see backend_api/.env.production.example}
      # True because the nginx frontend is the trusted proxy; do not expose :8000 publicly
      - TRUST_PROXY_HEADERS=true
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost
      - LOG_LEVEL=INFO
      - AUTH_DB_PATH=/data/local_auth.db
      # Tier 1 telemetry store (additive; unset = JSON-file mode).
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ergovigilance}:${POSTGRES_PASSWORD:-ergovigilance}@db:5432/${POSTGRES_DB:-ergovigilance}
      # Session JSON files live on the /data volume so file-mode sessions
      # survive container recreation (down/up) — not just the container layer.
      - SESSIONS_DIR=/data/sessions
      # Audit trail lives on the persistent /data volume (auto-provisioned
      # HMAC key at /data/audit_hmac.key — survives container recreation).
      - AUDIT_LOG_DIR=/data/audit_logs
      # Bearer for the stats endpoints (/metrics, /sla, ...); empty + DEBUG=false
      # means those endpoints refuse (health probes stay open).
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - PG_TIMESCALEDB=${PG_TIMESCALEDB:-false}
    volumes:
      - ergovigilance-db:/data
      - ./outputs/sessions:/data/sessions
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Liveness probe for orchestrators / docker compose ps (python, not curl,
    # because the image is python:3.12-slim and ships no curl).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: ui_posture/Dockerfile
    container_name: ergovigilance-frontend
    ports:
      # Plain HTTP, so the stack starts with no certificate material on the
      # host. Add HTTPS on :443 with the TLS overlay (see certs/README.md):
      #   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  cloud-core:
    build:
      context: .
      dockerfile: yolo_cloud/Dockerfile
    container_name: ergovigilance-cloud
    ports:
      - "127.0.0.1:${CLOUD_PORT:-8100}:8100"
    environment:
      # Production posture by default; set DEBUG=true for local development.
      - DEBUG=${DEBUG:-false}
      - YOLO_MODEL=${YOLO_MODEL:-yolov8s-pose.pt}
      - YOLO_DEVICE=${YOLO_DEVICE:-cpu}
      - YOLO_CONFIDENCE=${YOLO_CONFIDENCE:-0.5}
      - INFERENCE_FPS=${INFERENCE_FPS:-10}
      - CLOUD_PORT=8100
      - RTSP_TRANSPORT=${RTSP_TRANSPORT:-tcp}
      - RTSP_TIMEOUT=${RTSP_TIMEOUT:-5}
      - RTSP_RECONNECT_DELAY=${RTSP_RECONNECT_DELAY:-2.0}
      - SESSION_IDLE_TIMEOUT=${SESSION_IDLE_TIMEOUT:-60}
      # Free-space watermark for HIGH-alert clips (0 disables; oldest clips
      # are pruned before a write once free space drops below this).
      - CLIP_MIN_FREE_GB=${CLIP_MIN_FREE_GB:-2}
      - SESSIONS_DIR=/data/sessions
      # Required: the service validates JWTs; an empty secret would accept
      # nothing meaningful or worse, silently accept dev tokens.
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required (>=32 chars) - see backend_api/.env.production.example}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost
    volumes:
      - ergovigilance-db:/data
      - ./outputs/sessions:/data/sessions
      - ./recordings:/data/recordings
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Uncomment below for GPU access (requires NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ergovigilance-db:
  ergovigilance-pg:
